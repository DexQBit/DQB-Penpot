name: Build Fork Images (GHCR)

# Builds Penpot bundles via devenv, then pushes frontend/backend/exporter
# images to ghcr.io/<owner>/penpot-<service>:<tag>.
#
# Required secrets (if Docker Hardened Images base pulls fail):
#   DHI_USER / DHI_TOKEN — credentials for dhi.io (same as upstream Penpot CI)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: sha / git tag)"
        type: string
        required: false

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build bundles and push images
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set namespace
        run: |
          # GHCR/Docker repository names must be lowercase
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "NAMESPACE=ghcr.io/${OWNER}/penpot" >> "$GITHUB_ENV"
          echo "Using namespace: ghcr.io/${OWNER}/penpot"

      - name: Set image tag
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${GITHUB_SHA::12}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Optional login to dhi.io
        continue-on-error: true
        env:
          DHI_USER: ${{ secrets.DHI_USER }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -n "$DHI_USER" ] && [ -n "$DHI_TOKEN" ]; then
            echo "$DHI_TOKEN" | docker login dhi.io -u "$DHI_USER" --password-stdin
          else
            echo "No DHI_* secrets; continuing without dhi.io login"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Penpot bundles
        env:
          BUILD_WASM: "yes"
          # Storybook / MCP not required for self-host core
          BUILD_STORYBOOK: "no"
        run: |
          ./manage.sh build-frontend-bundle
          ./manage.sh build-backend-bundle
          ./manage.sh build-exporter-bundle

      - name: Stage bundles into docker/images
        run: |
          cd docker/images
          rm -rf bundle-frontend bundle-backend bundle-exporter
          cp -r ../../bundles/frontend ./bundle-frontend
          cp -r ../../bundles/backend ./bundle-backend
          cp -r ../../bundles/exporter ./bundle-exporter

      - name: Build and push images
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        working-directory: docker/images
        run: |
          for svc in frontend backend exporter; do
            docker buildx build \
              --platform linux/amd64 \
              --push \
              -t "${NAMESPACE}-${svc}:${TAG}" \
              -t "${NAMESPACE}-${svc}:latest" \
              -f "Dockerfile.${svc}" \
              .
          done

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo "- \`${NAMESPACE}-frontend:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${NAMESPACE}-backend:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${NAMESPACE}-exporter:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
